services:
  db:
    image: postgres:16
    container_name: sporto_poc_db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: sporto_poc
    ports:
      - "5432:5432"
    volumes:
      - sporto_pgdata:/var/lib/postgresql/data
volumes:
  sporto_pgdata:
